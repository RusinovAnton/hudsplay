[project]
name = "iracing-overlay"
version = "0.1.0"
description = "Personal iRacing overlay: Python telemetry backend + HTML widgets"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "pycountry>=23.12",
    "pyyaml>=6",
    "pyirsdk; sys_platform == 'win32'",
]

[project.scripts]
overlay = "overlay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overlay"]
