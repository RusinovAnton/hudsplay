# Builds the Windows installer, signs it through SignPath (when configured) and publishes
# it as a GitHub release.
# Release: bump "version" in electron/package.json, commit, then
#   git tag v<version> && git push origin v<version>
# The website's download button points at releases/latest/download/racehud-setup.exe.
#
# Code signing (SignPath Foundation, free for open source), set in the repo settings:
#   Settings → Secrets and variables → Actions
#     secret   SIGNPATH_API_TOKEN          API token of the SignPath CI user
#     variable SIGNPATH_ORGANIZATION_ID    SignPath organization id
#     variable SIGNPATH_PROJECT_SLUG       optional, default "racehud"
#     variable SIGNPATH_SIGNING_POLICY     optional, default "release-signing"
# Until SIGNPATH_ORGANIZATION_ID is set, releases are published unsigned.
# What SignPath signs is described in .signpath/artifact-configuration.xml.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read # SignPath downloads the unsigned artifact from this run

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches electron/package.json version
        shell: pwsh
        run: |
          $version = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} != electron/package.json version $version"
          }

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build installer (backend exe + NSIS)
        shell: cmd
        run: build-installer.bat

      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: racehud-setup-unsigned
          path: packaging/installer/racehud-setup.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'racehud' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick the installer to publish
        id: pick
        shell: pwsh
        run: |
          if ($env:SIGNED -eq 'true') {
            $file = "signed/racehud-setup.exe"
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "signed installer has signature status $($sig.Status)" }
            $note = "The installer is code-signed (free code signing by SignPath.io, certificate by SignPath Foundation)."
          } else {
            $file = "packaging/installer/racehud-setup.exe"
            $note = "Windows SmartScreen may warn because the installer isn't code-signed yet: choose *More info → Run anyway*."
          }
          "file=$file" >> $env:GITHUB_OUTPUT
          "note=$note" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pick.outputs.file }}
          generate_release_notes: true
          body: |
            **Install:** download `racehud-setup.exe` below and run it. ${{ steps.pick.outputs.note }}
            In iRacing, use borderless windowed mode. Website: https://rusinovanton.github.io/racehud/
